# ============================================================
# Nginx — production reverse proxy with DDoS + WAF layer
# Place at: /etc/nginx/sites-available/md5check
# ============================================================

# --- connection zones (limit_req uses this) ---
limit_req_zone  $binary_remote_addr zone=global:20m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m      rate=2r/s;
limit_req_zone  $binary_remote_addr zone=api:10m       rate=10r/s;
limit_req_zone  $binary_remote_addr zone=static:10m    rate=50r/s;

limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# --- upstream ---
upstream md5check_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;

    # --- security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # --- request size limit ---
    client_max_body_size 128k;
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # --- timeouts (slowloris defense) ---
    client_body_timeout    10s;
    client_header_timeout  10s;
    send_timeout           10s;
    keepalive_timeout      15s;
    reset_timedout_connection on;

    # --- connection limits ---
    limit_conn conn_per_ip 30;

    # --- global rate limit ---
    limit_req zone=global burst=40 nodelay;

    # --- block common bots / scanners ---
    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|acunetix|nessus|dirbuster|gobuster|wfuzz|hydra)) {
        return 403;
    }

    # --- block requests without Host ---
    if ($host = "") {
        return 444;
    }

    # --- block obvious path scans ---
    location ~* /\.(git|env|svn|hg) {
        deny all;
        return 404;
    }

    location ~* (wp-admin|wp-login|phpmyadmin|adminer|\.php$) {
        return 404;
    }

    # --- static files (fast) ---
    location /static/ {
        limit_req zone=static burst=100 nodelay;
        proxy_pass http://md5check_backend;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- auth routes (tight) ---
    location ~ ^/api/(login|register|verify|pay) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://md5check_backend;
        include /etc/nginx/proxy_params_md5check;
    }

    # --- api endpoints ---
    location ~ ^/(api_md5|api/) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://md5check_backend;
        include /etc/nginx/proxy_params_md5check;
    }

    # --- everything else ---
    location / {
        proxy_pass http://md5check_backend;
        include /etc/nginx/proxy_params_md5check;
    }

    # --- block suspicious methods at nginx level ---
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 405;
    }

    # --- deny direct ip access (except health) ---
    location = /api/health {
        allow all;
        proxy_pass http://md5check_backend;
    }
}
